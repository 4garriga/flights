[project]
name = "flights"
version = "0.1.0"
description = "cs577 project - aviation planned maintenance interval predictions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dask[dataframe]>=2025.10.0",
    "lightgbm>=4.6.0",
    "optuna>=4.6.0",
    "scikit-learn>=1.7.2",
    "shap>=0.49.1",
    "xgboost>=3.1.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
]
